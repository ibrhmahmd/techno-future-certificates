{% if success %}
<div style="background: var(--secondary-container); border: 1px solid #b2dfdb; border-radius: var(--radius-lg); padding: 1.5rem;">
    <div class="flex items-center mb-3">
        <svg style="height: 1.25rem; width: 1.25rem; color: var(--secondary); margin-right: 0.5rem;" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
        <h3 style="font-family: 'Space Grotesk', sans-serif; font-size: 1.125rem; font-weight: 600; color: var(--on-secondary-container);">Certificate Generated</h3>
    </div>
    <dl class="grid grid-cols-2 gap-3 text-sm">
        <dt style="color: var(--on-secondary-container);">Certificate ID</dt>
        <dd style="font-family: 'JetBrains Mono', monospace; color: var(--secondary); font-weight: 500;">{{ cert.cert_id }}</dd>
        <dt style="color: var(--on-secondary-container);">Student</dt>
        <dd style="color: var(--on-secondary-container);">{{ cert.student_name }}</dd>
        <dt style="color: var(--on-secondary-container);">Course</dt>
        <dd style="color: var(--on-secondary-container);">{{ cert.course_name }}</dd>
        <dt style="color: var(--on-secondary-container);">Level</dt>
        <dd style="color: var(--on-secondary-container);">{{ cert.level }}</dd>
    </dl>
    <div class="mt-4 flex gap-2">
        <a href="/certificates/{{ cert.cert_id }}" style="display: inline-flex; align-items: center; padding: 0.375rem 0.75rem; border: none; border-radius: var(--radius-md); font-size: 0.875rem; font-weight: 500; color: #ffffff; background: var(--secondary); text-decoration: none;" onmouseover="this.style.background='#004d46'" onmouseout="this.style.background='#006a61'">View Details</a>
        <a href="/api/v1/certificates/{{ cert.cert_id }}/pdf" download style="display: inline-flex; align-items: center; padding: 0.375rem 0.75rem; border: 1px solid var(--surface-container); border-radius: var(--radius-md); font-size: 0.875rem; font-weight: 500; color: var(--on-background); background: var(--surface-container-lowest); text-decoration: none;" onmouseover="this.style.background='var(--surface)'" onmouseout="this.style.background='var(--surface-container-lowest)'">Download PDF</a>
    </div>
</div>
{% elif error %}
<div style="background: var(--error-container); border: 1px solid #fecaca; border-radius: var(--radius-lg); padding: 1rem;">
    <p style="font-size: 0.875rem; color: var(--error);">{{ error }}</p>
</div>
{% endif %}
