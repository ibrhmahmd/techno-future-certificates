{% if success %}
<div style="background: var(--secondary-container); border-radius: var(--radius-lg); padding: 1.5rem;">
    <div class="flex items-center" style="margin-bottom: 1rem;">
        <svg style="height: 1.25rem; width: 1.25rem; color: var(--secondary); margin-right: 0.5rem;" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
        <h3 style="font-size: 1rem; font-weight: 600; color: var(--on-secondary-container);">Certificate Generated</h3>
    </div>
    <dl style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.625rem; font-size: 0.8125rem;">
        <dt style="color: var(--on-secondary-container); opacity: 0.7;">Certificate ID</dt>
        <dd style="font-family: 'Space Grotesk', sans-serif; font-weight: 500; color: var(--on-secondary-container);">{{ cert.cert_id }}</dd>
        <dt style="color: var(--on-secondary-container); opacity: 0.7;">Student</dt>
        <dd style="color: var(--on-secondary-container);">{{ cert.student_name }}</dd>
        <dt style="color: var(--on-secondary-container); opacity: 0.7;">Course</dt>
        <dd style="color: var(--on-secondary-container);">{{ cert.course_name }}</dd>
        <dt style="color: var(--on-secondary-container); opacity: 0.7;">Level</dt>
        <dd style="color: var(--on-secondary-container);">{{ cert.level }}</dd>
    </dl>
    <div class="flex" style="gap: 0.5rem; margin-top: 1.25rem;">
        <a href="/certificates/{{ cert.cert_id }}" style="display: inline-flex; align-items: center; padding: 0.5rem 1rem; border: none; border-radius: var(--radius-md); font-size: 0.8125rem; font-weight: 600; color: #ffffff; background: var(--secondary); text-decoration: none; transition: background 0.15s;" onmouseover="this.style.background='#004d46'" onmouseout="this.style.background='#006a61'">View Details</a>
        <a href="/api/v1/certificates/{{ cert.cert_id }}/pdf" download style="display: inline-flex; align-items: center; padding: 0.5rem 1rem; border: none; border-radius: var(--radius-md); font-size: 0.8125rem; font-weight: 500; color: var(--on-secondary-container); background: rgba(255,255,255,0.5); text-decoration: none; transition: background 0.15s;" onmouseover="this.style.background='rgba(255,255,255,0.7)'" onmouseout="this.style.background='rgba(255,255,255,0.5)'">Download PDF</a>
    </div>
</div>
{% elif error %}
<div style="background: var(--error-container); border-radius: var(--radius-lg); padding: 1rem;">
    <p style="font-size: 0.875rem; color: var(--error);">{{ error }}</p>
</div>
{% endif %}
