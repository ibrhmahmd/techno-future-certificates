{% if success %}
<div class="bg-green-50 border border-green-200 rounded-lg p-6">
    <div class="flex items-center mb-3">
        <svg class="h-5 w-5 text-green-400 mr-2" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
        <h3 class="text-lg font-medium text-green-800">Certificate Generated</h3>
    </div>
    <dl class="grid grid-cols-2 gap-3 text-sm">
        <dt class="text-gray-500">Certificate ID</dt>
        <dd class="font-mono text-indigo-600 font-medium">{{ cert.cert_id }}</dd>
        <dt class="text-gray-500">Student</dt>
        <dd class="text-gray-900">{{ cert.student_name }}</dd>
        <dt class="text-gray-500">Course</dt>
        <dd class="text-gray-900">{{ cert.course_name }}</dd>
        <dt class="text-gray-500">Level</dt>
        <dd class="text-gray-900">{{ cert.level }}</dd>
    </dl>
    <div class="mt-4 flex gap-2">
        <a href="/certificates/{{ cert.cert_id }}" class="inline-flex items-center px-3 py-1.5 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700">View Details</a>
        <a href="/api/v1/certificates/{{ cert.cert_id }}/pdf" class="inline-flex items-center px-3 py-1.5 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">Download PDF</a>
    </div>
</div>
{% elif error %}
<div class="bg-red-50 border border-red-200 rounded-lg p-4">
    <p class="text-sm text-red-600">{{ error }}</p>
</div>
{% endif %}
