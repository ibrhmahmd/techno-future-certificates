{% extends "base.html" %}
{% block title %}Registry — Certificate Manager{% endblock %}
{% block content %}
<div class="px-4 sm:px-0">
    <div class="flex justify-between items-center mb-6">
        <h1 style="font-family: 'Space Grotesk', sans-serif; color: var(--primary); font-weight: 700; font-size: 1.5rem;">Certificate Registry</h1>
        <div class="flex gap-2">
            <a href="/api/v1/certificates/export?track={{ track }}&search={{ search }}" style="display: inline-flex; align-items: center; padding: 0.375rem 0.75rem; border: 1px solid var(--surface-container); border-radius: var(--radius-md); font-size: 0.875rem; font-weight: 500; color: var(--on-background); background: var(--surface-container-lowest); text-decoration: none;" onmouseover="this.style.background='var(--surface)'" onmouseout="this.style.background='var(--surface-container-lowest)'">
                Export CSV
            </a>
        </div>
    </div>

    <!-- Filters -->
    <div style="background: var(--surface-container-lowest); border: 1px solid var(--surface-container); border-radius: var(--radius-lg); padding: 1rem; margin-bottom: 1.5rem;">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
                <label style="display: block; font-size: 0.875rem; font-weight: 500; color: var(--on-background); margin-bottom: 0.25rem;">Search</label>
                <input type="text" name="search" value="{{ search }}" placeholder="Student name or ID..."
                    hx-get="/partials/registry-table" hx-trigger="keyup changed delay:300ms" hx-target="#cert-table" hx-include="[name='track']"
                    style="display: block; width: 100%; border: 1px solid var(--surface-container); border-radius: var(--radius-md); padding: 0.5rem 0.75rem; font-size: 0.875rem; color: var(--on-background); background: var(--surface-container-lowest); outline: none;" onfocus="this.style.borderColor='var(--secondary)'" onblur="this.style.borderColor='var(--surface-container)'">
            </div>
            <div>
                <label style="display: block; font-size: 0.875rem; font-weight: 500; color: var(--on-background); margin-bottom: 0.25rem;">Track</label>
                <select name="track"
                    hx-get="/partials/registry-table" hx-trigger="change" hx-target="#cert-table" hx-include="[name='search']"
                    style="display: block; width: 100%; border: 1px solid var(--surface-container); border-radius: var(--radius-md); padding: 0.5rem 0.75rem; font-size: 0.875rem; color: var(--on-background); background: var(--surface-container-lowest); outline: none;" onfocus="this.style.borderColor='var(--secondary)'" onblur="this.style.borderColor='var(--surface-container)'">
                    <option value="">All Tracks</option>
                    <option value="html" {% if track == "html" %}selected{% endif %}>HTML</option>
                    <option value="css" {% if track == "css" %}selected{% endif %}>CSS</option>
                    <option value="javascript" {% if track == "javascript" %}selected{% endif %}>JavaScript</option>
                    <option value="python" {% if track == "python" %}selected{% endif %}>Python</option>
                    <option value="advanced" {% if track == "advanced" %}selected{% endif %}>Advanced</option>
                    <option value="problem_solving" {% if track == "problem_solving" %}selected{% endif %}>Problem Solving</option>
                    <option value="robotics-wedo" {% if track == "robotics-wedo" %}selected{% endif %}>Robotics WeDo 2.0</option>
                    <option value="robotics-spike-essential" {% if track == "robotics-spike-essential" %}selected{% endif %}>Robotics SPIKE Essential</option>
                    <option value="robotics-spike-prime" {% if track == "robotics-spike-prime" %}selected{% endif %}>Robotics SPIKE Prime</option>
                    <option value="robotics-ev3" {% if track == "robotics-ev3" %}selected{% endif %}>Robotics EV3</option>
                    <option value="robotics-arduino" {% if track == "robotics-arduino" %}selected{% endif %}>Robotics Arduino</option>
                    <option value="scratch" {% if track == "scratch" %}selected{% endif %}>Scratch</option>
                    <option value="scratch-jr" {% if track == "scratch-jr" %}selected{% endif %}>Scratch Jr</option>
                </select>
            </div>
            <div class="flex items-end">
                <span style="font-size: 0.875rem; color: var(--on-surface-muted);">{{ total }} certificates found</span>
            </div>
        </div>
    </div>

    <!-- Table -->
    <div id="cert-table">
        {% include "partials/cert_table.html" %}
    </div>
</div>
{% endblock %}
