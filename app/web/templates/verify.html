{% extends "base.html" %}
{% block title %}Verify Certificate — Certificate Manager{% endblock %}
{% block content %}
<div style="max-width: 32rem; margin: 0 auto; padding: 0 1rem;">
    <h1 style="font-size: 1.75rem; font-weight: 600; color: var(--on-background); letter-spacing: -0.03em; margin-bottom: 2rem;">Verify Certificate</h1>

    <div class="pe-card" style="padding: 2rem;">
        <form hx-get="/partials/verify-result" hx-target="#verify-result" hx-swap="innerHTML" hx-trigger="submit" style="display: flex; flex-direction: column; gap: 1.5rem;">
            <div>
                <label class="pe-input-label">Certificate ID</label>
                <input type="text" name="cert_id" value="{{ cert_id }}" placeholder="TKTF-XXXX-YYYYMMDD-NNNN" required
                    class="pe-input" style="font-family: 'Space Grotesk', sans-serif; font-weight: 500;">
            </div>
            <div class="flex justify-end">
                <button type="submit" class="pe-btn-primary">
                    Verify
                </button>
            </div>
        </form>
    </div>

    <div id="verify-result" style="margin-top: 1.5rem;">
        {% if result %}
            {% include "partials/verify_result.html" %}
        {% elif error %}
            {% include "partials/verify_result.html" %}
        {% endif %}
    </div>
</div>
{% endblock %}
