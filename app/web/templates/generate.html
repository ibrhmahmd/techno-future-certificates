{% extends "base.html" %}
{% block title %}Generate Certificate — Certificate Manager{% endblock %}
{% block content %}
<div style="max-width: 40rem; margin: 0 auto; padding: 0 1rem;">
    <h1 style="font-size: 1.75rem; font-weight: 600; color: var(--on-background); letter-spacing: -0.03em; margin-bottom: 2rem;">Generate Certificate</h1>

    <form id="gen-form" hx-post="/partials/generate-result" hx-target="#gen-result" hx-swap="innerHTML" hx-indicator="#gen-btn" class="pe-card" style="padding: 2rem;">
        <div style="display: flex; flex-direction: column; gap: 1.75rem;">
            <div>
                <label class="pe-input-label">Student Name *</label>
                <input type="text" name="student_name" required class="pe-input" placeholder="Enter student name">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2" style="gap: 1.75rem;">
                <div>
                    <label class="pe-input-label">Course Track *</label>
                    <select name="course_track" required class="pe-select">
                        <option value="">Select track...</option>
                        <option value="html">HTML</option>
                        <option value="css">CSS</option>
                        <option value="javascript">JavaScript</option>
                        <option value="python">Python</option>
                        <option value="advanced">Advanced</option>
                        <option value="problem_solving">Problem Solving</option>
                        <option value="robotics-wedo">Robotics WeDo 2.0</option>
                        <option value="robotics-spike-essential">Robotics SPIKE Essential</option>
                        <option value="robotics-spike-prime">Robotics SPIKE Prime</option>
                        <option value="robotics-ev3">Robotics EV3</option>
                        <option value="robotics-arduino">Robotics Arduino</option>
                        <option value="scratch">Scratch</option>
                        <option value="scratch-jr">Scratch Jr</option>
                    </select>
                </div>
                <div>
                    <label class="pe-input-label">Level *</label>
                    <select name="level" required class="pe-select">
                        <option value="">Select level...</option>
                        <option value="Level 1 — Junior">Level 1 — Junior</option>
                        <option value="Level 2 — Intermediate">Level 2 — Intermediate</option>
                        <option value="Level 3 — Advanced">Level 3 — Advanced</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2" style="gap: 1.75rem;">
                <div>
                    <label class="pe-input-label">Issue Date *</label>
                    <input type="date" name="issue_date" required class="pe-input">
                </div>
                <div>
                    <label class="pe-input-label">Branch *</label>
                    <input type="text" name="branch" required placeholder="e.g. Heliopolis" class="pe-input">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2" style="gap: 1.75rem;">
                <div>
                    <label class="pe-input-label">Instructor</label>
                    <input type="text" name="instructor" class="pe-input" placeholder="Optional">
                </div>
                <div>
                    <label class="pe-input-label">Director</label>
                    <input type="text" name="director" class="pe-input" placeholder="Optional">
                </div>
            </div>

            <div class="flex justify-end" style="padding-top: 0.5rem;">
                <button id="gen-btn" type="submit" class="pe-btn-primary">
                    <span class="htmx-indicator" style="margin-right: 0.5rem;">Generating...</span>
                    Generate Certificate
                </button>
            </div>
        </div>
    </form>

    <div id="gen-result" style="margin-top: 1.5rem;"></div>
</div>
{% endblock %}
