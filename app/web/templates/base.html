<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Certificate Manager{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx-ext-response-targets@2.0.0/response-targets.js"></script>
    <style>
        :root {
            --primary: #000000;
            --primary-container: #131b2e;
            --secondary: #006a61;
            --secondary-fixed: #89f5e7;
            --secondary-container: #e0f5f1;
            --on-secondary-container: #004d46;
            --tertiary: #7671ff;
            --tertiary-light: #a5a1ff;
            --tertiary-container: #7671ff;
            --surface: #f8f9ff;
            --surface-container: #e5eeff;
            --surface-container-low: #eff4ff;
            --surface-container-lowest: #ffffff;
            --on-background: #0b1c30;
            --on-surface-muted: #5A6070;
            --on-surface-variant: #45464d;
            --outline-variant: rgba(198, 198, 205, 0.15);
            --error: #D32F2F;
            --error-container: #FFF5F5;
            --on-error-container: #D32F2F;
            --ambient-shadow: 0 12px 40px rgba(11, 28, 48, 0.06);
            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-lg: 8px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--surface);
            color: var(--on-background);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Space Grotesk', sans-serif;
        }

        /* ── Precision Engine Components ── */

        /* Card: tonal layering, no borders */
        .pe-card {
            background: var(--surface-container-lowest);
            box-shadow: var(--ambient-shadow);
            border-radius: var(--radius-lg);
        }

        /* Ghost Input: bottom-border only, terminal-style */
        .pe-input {
            display: block;
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--surface-container);
            border-radius: 0;
            padding: 0.625rem 0.25rem;
            font-size: 0.875rem;
            font-family: 'Inter', sans-serif;
            color: var(--on-background);
            outline: none;
            transition: border-color 0.15s;
            letter-spacing: -0.01em;
        }
        .pe-input::placeholder {
            color: var(--on-surface-variant);
        }
        .pe-input:focus {
            border-bottom-color: var(--secondary);
        }
        .pe-input-label {
            display: block;
            font-size: 0.6875rem;
            font-weight: 600;
            color: var(--on-surface-variant);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.375rem;
        }

        /* Select: same ghost treatment */
        .pe-select {
            display: block;
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--surface-container);
            border-radius: 0;
            padding: 0.625rem 0.25rem;
            font-size: 0.875rem;
            font-family: 'Inter', sans-serif;
            color: var(--on-background);
            outline: none;
            cursor: pointer;
            transition: border-color 0.15s;
        }
        .pe-select:focus {
            border-bottom-color: var(--secondary);
        }

        /* Button: primary solid */
        .pe-btn-primary {
            display: inline-flex;
            align-items: center;
            padding: 0.625rem 1.25rem;
            border: none;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            background: var(--secondary);
            cursor: pointer;
            transition: background 0.15s, box-shadow 0.15s;
            letter-spacing: -0.01em;
        }
        .pe-btn-primary:hover {
            background: #004d46;
            box-shadow: 0 4px 16px rgba(0, 106, 97, 0.2);
        }

        /* Button: ghost */
        .pe-btn-ghost {
            display: inline-flex;
            align-items: center;
            padding: 0.625rem 1.25rem;
            border: none;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            color: var(--on-surface-variant);
            background: transparent;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .pe-btn-ghost:hover {
            background: var(--surface-container-low);
            color: var(--on-background);
        }

        /* Status Chip */
        .pe-chip {
            display: inline-flex;
            align-items: center;
            padding: 0.1875rem 0.625rem;
            border-radius: 9999px;
            font-size: 0.6875rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        .pe-chip-success {
            background: var(--secondary-container);
            color: var(--on-secondary-container);
        }
        .pe-chip-error {
            background: var(--error-container);
            color: var(--on-error-container);
        }

        /* Table */
        .pe-table {
            width: 100%;
            border-collapse: collapse;
        }
        .pe-table th {
            padding: 0.6rem 1rem;
            text-align: left;
            font-size: 0.6875rem;
            font-weight: 600;
            color: var(--on-surface-variant);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            background: var(--surface-container-low);
        }
        .pe-table td {
            padding: 0.6rem 1rem;
            font-size: 0.8125rem;
            letter-spacing: -0.01em;
        }
        .pe-table tbody tr:nth-child(odd) {
            background: var(--surface-container-lowest);
        }
        .pe-table tbody tr:nth-child(even) {
            background: var(--surface);
        }
        .pe-table tbody tr:hover {
            background: var(--surface-container-low);
        }

        /* Tonal Link */
        .pe-link {
            color: var(--secondary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.15s;
        }
        .pe-link:hover {
            color: #004d46;
        }

        /* Section Label */
        .pe-section-label {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--on-background);
            letter-spacing: -0.02em;
        }

        /* htmx */
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-block; }
        .htmx-request.htmx-indicator { display: inline-block; }
    </style>
</head>
<body class="h-full">
    <div class="min-h-full">
        <!-- Nav: Glassmorphism -->
        <nav style="background: rgba(248, 249, 255, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 50;">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex">
                        <div class="flex-shrink-0 flex items-center">
                            <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.25rem; color: var(--on-background); letter-spacing: -0.03em;">TKTF</span>
                            <span style="font-size: 0.6875rem; font-weight: 600; color: var(--secondary); text-transform: uppercase; letter-spacing: 0.15em; margin-left: 0.625rem;">Certificate Manager</span>
                        </div>
                        <div class="hidden sm:ml-8 sm:flex sm:space-x-1">
                            <a href="/" class="pe-nav-link" style="font-size: 0.8125rem; font-weight: 500; color: {% if request.url.path == '/' %}var(--on-background){% else %}var(--on-surface-variant){% endif %}; padding: 0.5rem 0.75rem; border-radius: var(--radius-md); background: {% if request.url.path == '/' %}var(--surface-container-low){% else %}transparent{% endif %}; transition: all 0.15s;">
                                Dashboard
                            </a>
                            <a href="/generate" class="pe-nav-link" style="font-size: 0.8125rem; font-weight: 500; color: {% if request.url.path == '/generate' %}var(--on-background){% else %}var(--on-surface-variant){% endif %}; padding: 0.5rem 0.75rem; border-radius: var(--radius-md); background: {% if request.url.path == '/generate' %}var(--surface-container-low){% else %}transparent{% endif %}; transition: all 0.15s;">
                                Generate
                            </a>
                            <a href="/registry" class="pe-nav-link" style="font-size: 0.8125rem; font-weight: 500; color: {% if request.url.path == '/registry' %}var(--on-background){% else %}var(--on-surface-variant){% endif %}; padding: 0.5rem 0.75rem; border-radius: var(--radius-md); background: {% if request.url.path == '/registry' %}var(--surface-container-low){% else %}transparent{% endif %}; transition: all 0.15s;">
                                Registry
                            </a>
                            <a href="/verify" class="pe-nav-link" style="font-size: 0.8125rem; font-weight: 500; color: {% if request.url.path == '/verify' %}var(--on-background){% else %}var(--on-surface-variant){% endif %}; padding: 0.5rem 0.75rem; border-radius: var(--radius-md); background: {% if request.url.path == '/verify' %}var(--surface-container-low){% else %}transparent{% endif %}; transition: all 0.15s;">
                                Verify
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main -->
        <main class="max-w-7xl mx-auto py-8 sm:px-6 lg:px-8">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
